name: RER trusted project build
on:
  workflow_call:
    inputs:
      installation_id:
        required: true
        type: string
      broker_url:
        required: true
        type: string
      artifact_file:
        required: false
        type: string
        default: lamp-worker-artifact.json
      environment:
        required: true
        type: string
      verification_profile:
        required: false
        type: string
        default: full
      build_profile:
        required: false
        type: string
        default: edition
      pnpm_version:
        required: false
        type: string
        default: '8.15.6'
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.8.1'
      - name: Install candidate dependencies without deployment credentials or OIDC
        if: inputs.build_profile == 'edition'
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        run: |
          case "$PNPM_VERSION" in 8.15.6|10.12.4) ;; *) echo 'Unsupported edition pnpm version'; exit 1 ;; esac
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile
      - name: Validate build profile
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          case "$BUILD_PROFILE" in edition|project) ;; *) echo 'Unsupported build profile'; exit 1 ;; esac
      # Playwright 1.55 extraction hangs on Node 26.8.1; only installation uses Node 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
        if: inputs.build_profile == 'edition'
      - name: Install browser assets
        if: inputs.build_profile == 'edition'
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Install edition verification tools
        if: inputs.build_profile == 'edition' && inputs.verification_profile == 'full'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.8.1'
      - name: Verify and package candidate
        if: inputs.build_profile == 'edition'
        env:
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          case "$VERIFICATION_PROFILE" in
            full) pnpm verify ;;
            visual) pnpm verify:visual ;;
            *) echo 'Unsupported verification profile'; exit 1 ;;
          esac
          node scripts/build-delivery-artifact.mjs
      - name: Run project-owned setup, build, verification and artifact commands
        if: inputs.build_profile == 'project'
        env:
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const project = JSON.parse(await readFile('rer-project.json', 'utf8'));
          if (project.schema !== 1 || project.deployment?.target !== 'cloudflare-workers' || (project.deployment.artifactFile ?? 'rer-worker-artifact.json') !== process.env.ARTIFACT_FILE) throw new Error('Project deployment descriptor mismatch');
          if (process.env.VERIFICATION_PROFILE !== 'full') throw new Error('Project build requires full verification');
          for (const name of ['build', 'verify']) if (typeof project.operations?.[name] !== 'string' || !project.operations[name].trim()) throw new Error(`Missing project ${name} command`);
          for (const name of ['setup', 'build', 'verify', 'artifact']) {
            const command = project.operations[name];
            if (command === undefined && ['setup', 'artifact'].includes(name)) continue;
            if (typeof command !== 'string' || !command.trim()) throw new Error(`Invalid project ${name} command`);
            execFileSync('/bin/bash', ['-e', '-o', 'pipefail', '-c', command], { stdio: 'inherit' });
          }
          JS
      - id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery-artifact/${{ inputs.artifact_file }}
            delivery-artifact/payload
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # This job never checks out or executes candidate source.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
      - name: Convert candidate artifact to a bounded raw-payload package and record source identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          BROKER_URL: ${{ inputs.broker_url }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile, mkdir, rm, lstat, open } from 'node:fs/promises';
          import { constants } from 'node:fs';
          import { createHash } from 'node:crypto';
          const env = process.env;
          const MAX_ARTIFACT_MANIFEST_BYTES = 4 * 1024 * 1024;
          const MAX_ARTIFACT_ENTRY_BYTES = 24 * 1024 * 1024;
          const MAX_ARTIFACT_PAYLOAD_BYTES = 96 * 1024 * 1024;
          const MAX_ARTIFACT_ENTRIES = 2048;
          const broker = new URL(env.BROKER_URL);
          if (broker.protocol !== 'https:' || broker.username || broker.password || broker.pathname !== '/' || broker.search || broker.hash) throw new Error('Broker must be an HTTPS origin');
          const api = async path => {
            const response = await fetch(`https://api.github.com${path}`, { headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' } });
            if (!response.ok) throw new Error(`GitHub API ${response.status}`);
            return response.json();
          };
          const oidcResponse = await fetch(`${env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(broker.origin)}`, { headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!oidcResponse.ok) throw new Error('OIDC request failed');
          const { value: token } = await oidcResponse.json();
          // Broker verifies signature; here the runner-provided token supplies reusable workflow identity.
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'));
          if (!/@[a-f0-9]{40}$/.test(claims.job_workflow_ref)) throw new Error('Caller must pin trusted workflow to full commit SHA');
          const commit = await api(`/repos/${env.GITHUB_REPOSITORY}/git/commits/${env.GITHUB_SHA}`);
          if (!['edition', 'project'].includes(env.BUILD_PROFILE)) throw new Error('Unsupported build profile');
          const lock = env.BUILD_PROFILE === 'edition' ? await api(`/repos/${env.GITHUB_REPOSITORY}/contents/sources.lock.json?ref=${env.GITHUB_SHA}`) : null;
          if (commit.sha !== env.GITHUB_SHA || !/^[a-f0-9]{40}$/.test(commit.tree?.sha) || (lock !== null && (lock.encoding !== 'base64' || typeof lock.content !== 'string'))) throw new Error('Invalid immutable source response');
          if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.json$/.test(env.ARTIFACT_FILE) || env.ARTIFACT_FILE === 'release-provenance.json') throw new Error('Invalid artifact filename');
          let sourceProvenance = 'source-lock', sourceIdentityBytes = lock === null ? null : Buffer.from(lock.content, 'base64');
          if (env.BUILD_PROFILE === 'project') {
            const descriptor = await api(`/repos/${env.GITHUB_REPOSITORY}/contents/rer-project.json?ref=${env.GITHUB_SHA}`);
            if (descriptor.encoding !== 'base64' || typeof descriptor.content !== 'string') throw new Error('Invalid immutable project descriptor');
            sourceProvenance = 'project-descriptor';
            sourceIdentityBytes = Buffer.from(descriptor.content, 'base64');
            const project = JSON.parse(sourceIdentityBytes);
            if (project.schema !== 1 || project.deployment?.target !== 'cloudflare-workers' || (project.deployment.artifactFile ?? 'rer-worker-artifact.json') !== env.ARTIFACT_FILE || env.VERIFICATION_PROFILE !== 'full') throw new Error('Immutable project deployment descriptor mismatch');
          } else if (!['lamp-worker-artifact.json','happytohelp-worker-artifact.json'].includes(env.ARTIFACT_FILE)) throw new Error('Unsupported edition artifact');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          if (!['full','visual'].includes(env.VERIFICATION_PROFILE)) throw new Error('Unsupported verification profile');
          const safeRelativePath = value => Boolean(value) && !value.startsWith('/') && !value.includes('\\') && !value.split('/').some(part => !part || part === '.' || part === '..');
          const safeModuleName = value => safeRelativePath(value) && !value.startsWith('payload/') && !/[\x00-\x1f\x7f"\\]/.test(value);
          const safeAssetPath = value => value.startsWith('/') && !value.includes('\\') && !value.slice(1).split('/').some(part => !part || part === '.' || part === '..');
          const privateArtifactEntry = value => /^(?:\.env(?:\..*)?|\.dev\.vars(?:\..*)?|\.npmrc|\.yarnrc(?:\.yml)?|\.netrc|\.pypirc)$/i.test(value.split('/').at(-1));
          const moduleTypes = new Set(['esm', 'commonjs', 'text', 'buffer', 'compiled-wasm']);
          const rejectUnknown = (value, fields, label) => { for (const key of Object.keys(value)) if (!fields.includes(key)) throw new Error(`Unexpected ${label} field`); };
          const decode = value => {
            if (typeof value !== 'string' || value.length % 4 === 1) throw new Error('Invalid legacy artifact payload encoding');
            const padding = value.endsWith('==') ? 2 : value.endsWith('=') ? 1 : 0;
            const contentLength = value.length - padding;
            for (let index = 0; index < contentLength; index += 1) {
              const code = value.charCodeAt(index);
              if (!((code >= 0x41 && code <= 0x5a) || (code >= 0x61 && code <= 0x7a) || (code >= 0x30 && code <= 0x39) || code === 0x2b || code === 0x2f)) throw new Error('Invalid legacy artifact payload encoding');
            }
            if (padding && value.slice(contentLength) !== '='.repeat(padding)) throw new Error('Invalid legacy artifact payload encoding');
            const bytes = Buffer.from(value, 'base64');
            if (bytes.toString('base64') !== value) throw new Error('Non-canonical legacy artifact payload encoding');
            return bytes;
          };
          const candidatePath = `candidate/${env.ARTIFACT_FILE}`;
          const candidateStat = await lstat(candidatePath);
          if (!candidateStat.isFile() || candidateStat.isSymbolicLink()) throw new Error('Candidate manifest must be a regular file');
          if (candidateStat.size > MAX_ARTIFACT_PAYLOAD_BYTES * 2) throw new Error('Candidate manifest exceeds size limit');
          const sourceArtifact = JSON.parse((await readFile(candidatePath)).toString('utf8'));
          if (sourceArtifact?.schema === 2 && candidateStat.size > MAX_ARTIFACT_MANIFEST_BYTES) throw new Error('Artifact manifest exceeds size limit');
          if (!sourceArtifact || typeof sourceArtifact !== 'object' || Array.isArray(sourceArtifact)) throw new Error('Invalid legacy artifact');
          rejectUnknown(sourceArtifact, ['schema', 'deploymentSpec', 'mainModule', 'modules', 'assets'], 'legacy artifact');
          if (![1,2].includes(sourceArtifact.schema) || typeof sourceArtifact.mainModule !== 'string' || !safeModuleName(sourceArtifact.mainModule) || !Array.isArray(sourceArtifact.modules) || !sourceArtifact.modules.length || !Array.isArray(sourceArtifact.assets)) throw new Error('Invalid legacy artifact structure');
          if (env.BUILD_PROFILE === 'project' && sourceArtifact.deploymentSpec === undefined) throw new Error('Project artifact requires explicit deployment specification');
          if (sourceArtifact.deploymentSpec !== undefined && (!sourceArtifact.deploymentSpec || typeof sourceArtifact.deploymentSpec !== 'object' || Array.isArray(sourceArtifact.deploymentSpec))) throw new Error('Invalid legacy deployment specification');
          if (sourceArtifact.modules.length + sourceArtifact.assets.length > MAX_ARTIFACT_ENTRIES) throw new Error('Artifact package has too many entries');
          const moduleNames = new Set(), assetPaths = new Set(), payloadBytes = { total: 0 };
          const manifest = { schema: 2, ...(sourceArtifact.deploymentSpec === undefined ? {} : { deploymentSpec: sourceArtifact.deploymentSpec }), mainModule: sourceArtifact.mainModule, modules: [], assets: [] };
          await rm('accepted', { recursive: true, force: true });
          await mkdir('accepted/payload/modules', { recursive: true });
          await mkdir('accepted/payload/assets', { recursive: true });
          const writePayload = async (bytes, payload) => {
            if (bytes.byteLength > MAX_ARTIFACT_ENTRY_BYTES) throw new Error('Artifact package entry exceeds size limit');
            payloadBytes.total += bytes.byteLength;
            if (payloadBytes.total > MAX_ARTIFACT_PAYLOAD_BYTES) throw new Error('Artifact package payload exceeds size limit');
            await writeFile(`accepted/${payload}`, bytes, { flag: 'wx' });
            return { size: bytes.byteLength, sha256: hash(bytes) };
          };
          const readCandidatePayload = async (entry, expectedPath, role) => {
            if (entry.role !== role || entry.payload !== expectedPath || !Number.isSafeInteger(entry.size) || entry.size < 0 || entry.size > MAX_ARTIFACT_ENTRY_BYTES || typeof entry.sha256 !== 'string' || !/^[a-f0-9]{64}$/.test(entry.sha256)) throw new Error('Invalid native payload identity');
            for (const directory of ['candidate/payload', `candidate/payload/${role}s`]) {
              const stat = await lstat(directory);
              if (!stat.isDirectory() || stat.isSymbolicLink()) throw new Error('Native payload directory must be real');
            }
            const file = await open(`candidate/${entry.payload}`, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
            try {
              const stat = await file.stat();
              if (!stat.isFile() || stat.size !== entry.size) throw new Error('Native payload size mismatch');
              const bytes = Buffer.alloc(entry.size + 1);
              let offset = 0;
              while (offset < bytes.length) {
                const {bytesRead} = await file.read(bytes, offset, bytes.length - offset, offset);
                if (!bytesRead) break;
                offset += bytesRead;
              }
              if (offset !== entry.size || hash(bytes.subarray(0,offset)) !== entry.sha256) throw new Error('Native payload digest mismatch');
              return bytes.subarray(0,offset);
            } finally { await file.close(); }
          };
          for (let index = 0; index < sourceArtifact.modules.length; index += 1) {
            const source = sourceArtifact.modules[index];
            if (!source || typeof source !== 'object' || Array.isArray(source)) throw new Error('Invalid legacy module descriptor');
            rejectUnknown(source, sourceArtifact.schema === 1 ? ['name', 'type', 'contentBase64'] : ['role','name','type','payload','size','sha256'], 'module');
            if (typeof source.name !== 'string' || !safeModuleName(source.name) || privateArtifactEntry(source.name) || moduleNames.has(source.name) || typeof source.type !== 'string' || !moduleTypes.has(source.type)) throw new Error('Invalid legacy module descriptor');
            moduleNames.add(source.name);
            const payload = `payload/modules/${String(index).padStart(6, '0')}`;
            const identity = await writePayload(sourceArtifact.schema === 1 ? decode(source.contentBase64) : await readCandidatePayload(source, payload, 'module'), payload);
            manifest.modules.push({ role: 'module', name: source.name, type: source.type, payload, ...identity });
          }
          if (!moduleNames.has(sourceArtifact.mainModule)) throw new Error('Artifact entry module is not declared');
          for (let index = 0; index < sourceArtifact.assets.length; index += 1) {
            const source = sourceArtifact.assets[index];
            if (!source || typeof source !== 'object' || Array.isArray(source)) throw new Error('Invalid legacy asset descriptor');
            rejectUnknown(source, sourceArtifact.schema === 1 ? ['path', 'contentBase64', 'contentType'] : ['role','path','contentType','payload','size','sha256'], 'asset');
            if (typeof source.path !== 'string' || !safeAssetPath(source.path) || privateArtifactEntry(source.path) || assetPaths.has(source.path) || typeof source.contentType !== 'string' || !/^[\w!#$&^_.+-]+\/[\w!#$&^_.+-]+$/.test(source.contentType)) throw new Error('Invalid legacy asset descriptor');
            assetPaths.add(source.path);
            const payload = `payload/assets/${String(index).padStart(6, '0')}`;
            const identity = await writePayload(sourceArtifact.schema === 1 ? decode(source.contentBase64) : await readCandidatePayload(source, payload, 'asset'), payload);
            manifest.assets.push({ role: 'asset', path: source.path, contentType: source.contentType, payload, ...identity });
          }
          const manifestBytes = Buffer.from(`${JSON.stringify(manifest)}\n`);
          if (manifestBytes.byteLength > MAX_ARTIFACT_MANIFEST_BYTES) throw new Error('Artifact manifest exceeds size limit');
          await writeFile(`accepted/${env.ARTIFACT_FILE}`, manifestBytes, { flag: 'wx' });
          const receipt = { schema: 2, artifactSchema: 2, verificationProfile: env.VERIFICATION_PROFILE, repositoryId: claims.repository_id, ownerId: claims.repository_owner_id, commitSha: commit.sha, treeSha: commit.tree.sha, sourceProvenance, sourceLockSha256: hash(sourceIdentityBytes), artifactSha256: hash(manifestBytes), runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT, workflowRef: claims.job_workflow_ref, artifactFile: env.ARTIFACT_FILE };
          await writeFile('accepted/release-provenance.json', `${JSON.stringify(receipt)}\n`, { flag: 'wx' });
          console.log(JSON.stringify({ schema: 2, artifactFile: env.ARTIFACT_FILE, modules: manifest.modules.length, assets: manifest.assets.length, payloadBytes: payloadBytes.total, manifestBytes: manifestBytes.byteLength }));
          JS
      - id: accepted
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted
          if-no-files-found: error
          retention-days: 30
      - name: Validate final trusted archive size
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
        run: |
          node --input-type=module <<'JS'
          const env = process.env;
          if (!/^\d+$/.test(env.ARTIFACT_ID)) throw new Error('Trusted artifact id is missing');
          const response = await fetch(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions/artifacts/${env.ARTIFACT_ID}`, { headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' } });
          if (!response.ok) throw new Error(`GitHub artifact metadata ${response.status}`);
          const metadata = await response.json();
          if (!Number.isSafeInteger(metadata.size_in_bytes) || metadata.size_in_bytes < 0) throw new Error('GitHub artifact size is unavailable');
          if (metadata.size_in_bytes > 64 * 1024 * 1024) throw new Error('Trusted artifact archive exceeds size limit');
          console.log(`Trusted artifact archive size: ${metadata.size_in_bytes} bytes`);
          JS
      - name: Prepare release through authenticated broker
        env:
          BROKER_URL: ${{ inputs.broker_url }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
          ARCHIVE_DIGEST: ${{ steps.accepted.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const env = process.env;
          const origin = new URL(env.BROKER_URL).origin;
          const response = await fetch(`${env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(origin)}`, { headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!response.ok) throw new Error('OIDC request failed');
          const { value: token } = await response.json();
          const receipt = JSON.parse(await readFile('accepted/release-provenance.json', 'utf8'));
          const body = { sourceProvenance: receipt.sourceProvenance, verificationProfile: receipt.verificationProfile, installationId: env.INSTALLATION_ID, environment: env.RELEASE_ENVIRONMENT, commitSha: receipt.commitSha, runId: receipt.runId, runAttempt: receipt.runAttempt, ref: env.GITHUB_REF, artifactId: env.ARTIFACT_ID, archiveDigest: `sha256:${env.ARCHIVE_DIGEST.replace(/^sha256:/, '')}`, artifactSha256: receipt.artifactSha256, treeSha: receipt.treeSha, sourceLockSha256: receipt.sourceLockSha256 };
          const result = await fetch(`${origin}/api/delivery/broker/prepare`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body), redirect: 'error' });
          if (!result.ok) throw new Error(`Broker prepare failed (${result.status}): ${await result.text()}`);
          console.log('Release prepared for owner review.');
          JS
