name: RER trusted edition build
on:
  workflow_call:
    inputs:
      installation_id:
        required: true
        type: string
      broker_url:
        required: true
        type: string
      artifact_file:
        required: false
        type: string
        default: lamp-worker-artifact.json
      environment:
        required: true
        type: string
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Build candidate without deployment credentials or OIDC
        run: |
          npm install --global pnpm@8.15.6
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm verify
          node scripts/build-delivery-artifact.mjs
      - id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-artifact/${{ inputs.artifact_file }}
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # This job never checks out or executes candidate source.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
      - name: Record independently observed source and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          BROKER_URL: ${{ inputs.broker_url }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const env = process.env;
          const broker = new URL(env.BROKER_URL);
          if (broker.protocol !== 'https:' || broker.username || broker.password || broker.pathname !== '/' || broker.search || broker.hash) throw new Error('Broker must be an HTTPS origin');
          const api = async path => {
            const response = await fetch(`https://api.github.com${path}`, { headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' } });
            if (!response.ok) throw new Error(`GitHub API ${response.status}`);
            return response.json();
          };
          const oidcResponse = await fetch(`${env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(broker.origin)}`, { headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!oidcResponse.ok) throw new Error('OIDC request failed');
          const { value: token } = await oidcResponse.json();
          // Broker verifies signature; here the runner-provided token supplies reusable workflow identity.
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'));
          if (!/@[a-f0-9]{40}$/.test(claims.job_workflow_ref)) throw new Error('Caller must pin trusted workflow to full commit SHA');
          const commit = await api(`/repos/${env.GITHUB_REPOSITORY}/git/commits/${env.GITHUB_SHA}`);
          const lock = await api(`/repos/${env.GITHUB_REPOSITORY}/contents/sources.lock.json?ref=${env.GITHUB_SHA}`);
          if (commit.sha !== env.GITHUB_SHA || lock.encoding !== 'base64' || typeof lock.content !== 'string') throw new Error('Invalid immutable source response');
          if (!['lamp-worker-artifact.json','happytohelp-worker-artifact.json'].includes(env.ARTIFACT_FILE)) throw new Error('Unsupported edition artifact');
          const artifact = await readFile(`candidate/${env.ARTIFACT_FILE}`);
          if (artifact.length > 64 * 1024 * 1024) throw new Error('Bundle too large');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const receipt = { schema: 1, repositoryId: claims.repository_id, ownerId: claims.repository_owner_id, commitSha: commit.sha, treeSha: commit.tree.sha, sourceLockSha256: hash(Buffer.from(lock.content, 'base64')), artifactSha256: hash(artifact), runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT, workflowRef: claims.job_workflow_ref, artifactFile: env.ARTIFACT_FILE };
          await mkdir('accepted');
          await writeFile(`accepted/${env.ARTIFACT_FILE}`, artifact);
          await writeFile('accepted/release-provenance.json', JSON.stringify(receipt));
          JS
      - id: accepted
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted/*
          if-no-files-found: error
          retention-days: 30
      - name: Prepare release through authenticated broker
        env:
          BROKER_URL: ${{ inputs.broker_url }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
          ARCHIVE_DIGEST: ${{ steps.accepted.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const env = process.env;
          const origin = new URL(env.BROKER_URL).origin;
          const response = await fetch(`${env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(origin)}`, { headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!response.ok) throw new Error('OIDC request failed');
          const { value: token } = await response.json();
          const receipt = JSON.parse(await readFile('accepted/release-provenance.json', 'utf8'));
          const body = { installationId: env.INSTALLATION_ID, environment: env.RELEASE_ENVIRONMENT, commitSha: receipt.commitSha, runId: receipt.runId, runAttempt: receipt.runAttempt, ref: env.GITHUB_REF, artifactId: env.ARTIFACT_ID, archiveDigest: `sha256:${env.ARCHIVE_DIGEST.replace(/^sha256:/, '')}`, artifactSha256: receipt.artifactSha256, treeSha: receipt.treeSha, sourceLockSha256: receipt.sourceLockSha256 };
          const result = await fetch(`${origin}/api/delivery/broker/prepare`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body), redirect: 'error' });
          if (!result.ok) throw new Error(`Broker prepare failed (${result.status}): ${await result.text()}`);
          console.log('Release prepared for owner review.');
          JS
