name: RER trusted project build
on:
  workflow_call:
    inputs:
      installation_id:
        required: true
        type: string
      broker_url:
        required: true
        type: string
      artifact_file:
        required: false
        type: string
        default: lamp-worker-artifact.json
      environment:
        required: true
        type: string
      verification_profile:
        required: false
        type: string
        default: full
      build_profile:
        required: false
        type: string
        default: edition
      pnpm_version:
        required: false
        type: string
        default: '8.15.6'
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      node_version: ${{ steps.runtime.outputs.version }}
      node_version_source: ${{ steps.node-pin.outputs.source }}
      node_pin: ${{ steps.node-pin.outputs.version }}
      build_observation: ${{ steps.observation.outputs.record }}
      package_manager_version: ${{ steps.project.outputs.package_manager_version || steps.dependencies.outputs.package_manager_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare project runner disk
        if: inputs.build_profile == 'project'
        run: |
          set -euo pipefail
          df -Pk /
          # Bounded to unused Android, .NET and Haskell SDKs on the hosted Ubuntu image.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -Pk /
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          printf 'Project runner free space: %s KiB (minimum 15 GiB)\n' "$available_kib"
          if ! [ "$available_kib" -ge "$((15 * 1024 * 1024))" ]; then
            echo '::error::Project builds require at least 15 GiB free before setup.'
            exit 1
          fi
      - name: Select the first exact project Node pin
        id: node-pin
        env:
          DEFAULT_NODE_VERSION: '26.8.1'
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def exact(value):
              if not isinstance(value, str):
                  return None
              match = re.fullmatch(r"v?((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))", value.strip())
              return match[1] if match else None

          def select():
              for name in (".node-version", ".nvmrc"):
                  path = Path(name)
                  version = exact(path.read_text()) if path.exists() else None
                  if version:
                      return version, name
              manifest = Path("package.json")
              package = json.loads(manifest.read_text()) if manifest.exists() else {}
              for field in ("engines", "volta"):
                  data = package.get(field)
                  version = exact(data.get("node")) if isinstance(data, dict) else None
                  if version:
                      return version, f"package.json:{field}.node"
              bootstrap = Path("scripts/agent-bootstrap.sh")
              if bootstrap.exists():
                  match = re.search(r"^\s*(?:readonly\s+)?NODE_VERSION=(?:['\"]([0-9.]+)['\"]|([0-9.]+))\s*(?:#.*)?$", bootstrap.read_text(), re.M)
                  version = exact(match[1] or match[2]) if match else None
                  if version:
                      return version, "scripts/agent-bootstrap.sh:NODE_VERSION"
              return os.environ["DEFAULT_NODE_VERSION"], "default"

          version, source = select()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nsource={source}\n")
          print(f"Selected Node {version} from {source}")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
      - name: Record hosted build toolchain and initialize command home
        id: observation
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, appendFile, rm, mkdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const hashFile = async file => createHash('sha256').update(await readFile(file)).digest('hex');
          const record = {
            schema: 1, runner: 'github-hosted:ubuntu-24.04', os: process.env.RUNNER_OS_NAME, arch: process.env.RUNNER_ARCH_NAME,
            imageOS: process.env.ImageOS ?? null, imageVersion: process.env.ImageVersion ?? null,
            osReleaseSha256: await hashFile('/etc/os-release'), kernel: execFileSync('/usr/bin/uname', ['-r'], { encoding: 'utf8' }).trim(),
            nodeSha256: await hashFile(process.execPath), bashSha256: await hashFile('/bin/bash'),
            commandPath: process.env.PATH,
          };
          // A fixed, initially empty HOME; this is hygiene, not a same-UID sandbox.
          await rm('/tmp/rer-build-home', { recursive: true, force: true });
          await mkdir('/tmp/rer-build-home', { mode: 0o700 });
          await appendFile(process.env.GITHUB_OUTPUT, `record=${JSON.stringify(record)}\n`);
          JS
      - name: Install candidate dependencies without deployment credentials or OIDC
        id: dependencies
        if: inputs.build_profile == 'edition'
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        run: |
          case "$PNPM_VERSION" in 8.15.6|10.12.4) ;; *) echo 'Unsupported edition pnpm version'; exit 1 ;; esac
          npm install --global "pnpm@$PNPM_VERSION"
          actual="$(pnpm --version)"
          test "$actual" = "$PNPM_VERSION"
          printf 'package_manager_version=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          command_path="$PATH"
          env -i PATH="$command_path" HOME=/tmp/rer-build-home TMPDIR=/tmp CI=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC /bin/bash --noprofile --norc -e -o pipefail -c 'pnpm install --frozen-lockfile'
      - name: Validate build profile
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          case "$BUILD_PROFILE" in edition|project) ;; *) echo 'Unsupported build profile'; exit 1 ;; esac
      # Playwright 1.55 extraction hangs on Node 26.8.1; only installation uses Node 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
        if: inputs.build_profile == 'edition'
      - name: Install browser assets
        if: inputs.build_profile == 'edition'
        run: |
          command_path="$PATH"
          env -i PATH="$command_path" HOME=/tmp/rer-build-home TMPDIR=/tmp CI=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC /bin/bash --noprofile --norc -e -o pipefail -c 'pnpm exec playwright install --with-deps chromium'
        timeout-minutes: 5
      - name: Install edition verification tools
        if: inputs.build_profile == 'edition' && inputs.verification_profile == 'full'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
      - name: Record the build runtime before candidate commands
        id: runtime
        env:
          NODE_VERSION: ${{ steps.node-pin.outputs.version }}
        run: |
          actual="$(node --version)"
          test "$actual" = "v$NODE_VERSION"
          printf 'version=%s\n' "${actual#v}" >> "$GITHUB_OUTPUT"
      - name: Verify and package candidate
        if: inputs.build_profile == 'edition'
        env:
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          case "$VERIFICATION_PROFILE" in
            full) verification='pnpm verify' ;;
            visual) verification='pnpm verify:visual' ;;
            *) echo 'Unsupported verification profile'; exit 1 ;;
          esac
          command_path="$PATH"
          env -i PATH="$command_path" HOME=/tmp/rer-build-home TMPDIR=/tmp CI=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC /bin/bash --noprofile --norc -e -o pipefail -c "$verification && node scripts/build-delivery-artifact.mjs"
      - name: Run project-owned setup, build, verification and artifact commands
        id: project
        if: inputs.build_profile == 'project'
        env:
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const commandEnvironment = { PATH: process.env.PATH, HOME: '/tmp/rer-build-home', TMPDIR: '/tmp', CI: 'true', LANG: 'C.UTF-8', LC_ALL: 'C.UTF-8', TZ: 'UTC' };
          const project = JSON.parse(await readFile('rer-project.json', 'utf8'));
          if (project.schema !== 1 || project.deployment?.target !== 'cloudflare-workers' || (project.deployment.artifactFile ?? 'rer-worker-artifact.json') !== process.env.ARTIFACT_FILE) throw new Error('Project deployment descriptor mismatch');
          if (process.env.VERIFICATION_PROFILE !== 'full') throw new Error('Project build requires full verification');
          for (const name of ['build', 'verify']) if (typeof project.operations?.[name] !== 'string' || !project.operations[name].trim()) throw new Error(`Missing project ${name} command`);
          let packageManager = project.packageManager, managerSource = 'rer-project.json:packageManager';
          try {
            const packageJson = JSON.parse(await readFile('package.json', 'utf8'));
            if (packageJson.packageManager !== undefined) {
              packageManager = packageJson.packageManager;
              managerSource = 'package.json:packageManager';
            }
          } catch (error) { if (error.code !== 'ENOENT') throw error; }
          if (packageManager !== undefined) {
            const pin = typeof packageManager === 'string' && /^(npm|pnpm|yarn)@((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)(?:\+sha(?:224|256|384|512)\.[0-9a-f]+)?$/.exec(packageManager);
            if (!pin) throw new Error('Project packageManager must pin an exact npm, pnpm or yarn release');
            const [, manager, version] = pin;
            console.log(`Installing ${manager}@${version} from ${managerSource}`);
            execFileSync('npm', ['install', '--global', '--no-audit', '--no-fund', `${manager}@${version}`], { stdio: 'inherit' });
            const actual = execFileSync(manager, ['--version'], { encoding: 'utf8' }).trim();
            if (actual !== version) throw new Error(`Project package manager version mismatch: expected ${version}, got ${actual}`);
            if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, `package_manager_version=${actual}\n`);
            console.log(`Project package manager: ${manager}@${actual}`);
          }
          for (const name of ['setup', 'build', 'verify', 'artifact']) {
            const command = project.operations[name];
            if (command === undefined && ['setup', 'artifact'].includes(name)) continue;
            if (typeof command !== 'string' || !command.trim()) throw new Error(`Invalid project ${name} command`);
            execFileSync('/bin/bash', ['--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', command], { stdio: 'inherit', env: commandEnvironment });
          }
          JS
      - name: Validate and stage producer package
        id: stage
        env:
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
        run: |
          node --input-type=module <<'JS'
          import { lstat, readdir, open, mkdir, mkdtemp, rm, appendFile, realpath } from 'node:fs/promises';
          import { constants } from 'node:fs';
          import { resolve, join, relative, isAbsolute, sep } from 'node:path';
          const env = process.env;
          const root = 'delivery-artifact';
          const remedy = 'copy the file into delivery-artifact/payload instead of linking it; use real directories and regular files with a single link';
          const reject = (path, type) => { throw new Error(`${JSON.stringify(path)}: ${type}; ${remedy}`); };
          const kind = stat => stat.isSymbolicLink() ? 'symbolic link' : stat.isFIFO() ? 'named pipe' : stat.isSocket() ? 'socket' : stat.isCharacterDevice() ? 'character device' : stat.isBlockDevice() ? 'block device' : stat.isDirectory() ? 'directory' : stat.isFile() ? 'regular file' : 'non-regular entry';
          const same = (a, b) => a.dev === b.dev && a.ino === b.ino;
          const files = [], directories = [];
          let stage, current = root;
          const inspect = async (path, expected) => {
            current = path;
            const stat = await lstat(path);
            if (stat.isSymbolicLink()) reject(path, 'symbolic link');
            else if (!stat.isFile() && !stat.isDirectory()) reject(path, kind(stat));
            if (stat.isFile() && stat.nlink !== 1) reject(path, 'hard-linked regular file');
            if (expected === 'directory' && !stat.isDirectory()) reject(path, `${kind(stat)} where a directory is required`);
            if (expected === 'file' && !stat.isFile()) reject(path, `${kind(stat)} where a regular file is required`);
            return stat;
          };
          const walk = async (path, expected) => {
            const stat = await inspect(path, expected);
            if (stat.isDirectory()) {
              directories.push({ path, stat });
              for (const name of await readdir(path)) await walk(join(path, name));
            } else files.push({ path, stat });
          };
          const checkDirectories = async () => {
            for (const entry of directories) {
              const stat = await inspect(entry.path, 'directory');
              if (!same(stat, entry.stat)) reject(entry.path, 'directory changed during staging');
            }
          };
          try {
            if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.json$/.test(env.ARTIFACT_FILE) || env.ARTIFACT_FILE === 'release-provenance.json') reject(env.ARTIFACT_FILE ?? '', 'invalid artifact filename; use a simple .json filename other than release-provenance.json');
            // Inventory the entire upload surface before opening any producer content.
            directories.push({ path: root, stat: await inspect(root, 'directory') });
            await walk(join(root, env.ARTIFACT_FILE), 'file');
            const payload = join(root, 'payload');
            current = payload;
            let payloadStat;
            try { payloadStat = await lstat(payload); } catch (error) { if (error.code !== 'ENOENT') throw error; }
            if (payloadStat) await walk(payload, 'directory');
            current = env.RUNNER_TEMP ?? '';
            if (!env.RUNNER_TEMP || !isAbsolute(env.RUNNER_TEMP)) reject(current, 'RUNNER_TEMP must be an absolute directory outside the workspace');
            const runnerTemp = await realpath(env.RUNNER_TEMP);
            const within = relative(resolve('.'), runnerTemp);
            if (!within || (!within.startsWith(`..${sep}`) && within !== '..' && !isAbsolute(within))) reject(current, 'RUNNER_TEMP is inside the workspace');
            stage = await mkdtemp(join(runnerTemp, 'delivery-stage-'));
            for (const entry of directories.slice(1)) await mkdir(join(stage, relative(root, entry.path)), { recursive: true });
            for (const entry of files) {
              // Recheck parents on both sides of open and compare the opened inode.
              // This is a checked snapshot, not a sandbox for hostile same-UID processes.
              await checkDirectories();
              current = entry.path;
              const source = await open(entry.path, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
              try {
                const stat = await source.stat();
                if (!stat.isFile()) reject(entry.path, kind(stat));
                if (stat.nlink !== 1) reject(entry.path, 'hard-linked regular file');
                if (!same(stat, entry.stat)) reject(entry.path, 'file changed during staging');
                await checkDirectories();
                current = entry.path;
                const bytes = await source.readFile();
                const after = await source.stat();
                if (after.nlink !== 1) reject(entry.path, 'hard-linked regular file');
                if (after.size !== stat.size || after.mtimeMs !== stat.mtimeMs || after.ctimeMs !== stat.ctimeMs) reject(entry.path, 'file changed during staging');
                const target = await open(join(stage, relative(root, entry.path)), 'wx', 0o600);
                try { await target.writeFile(bytes); } finally { await target.close(); }
              } finally { await source.close(); }
            }
            await checkDirectories();
            current = env.GITHUB_OUTPUT ?? '';
            await appendFile(env.GITHUB_OUTPUT, `directory=${stage}\n`);
            console.log('Producer package validated and staged.');
          } catch (error) {
            if (stage) await rm(stage, { recursive: true, force: true });
            console.error(error.code ? `${JSON.stringify(current)}: filesystem error ${error.code}; ${remedy}` : error.message);
            process.exitCode = 1;
          }
          JS
      - id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # This job never checks out or executes candidate source.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
      - name: Convert candidate artifact to a bounded raw-payload package and record source identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          BROKER_URL: ${{ inputs.broker_url }}
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
          NODE_VERSION: ${{ needs.build.outputs.node_version }}
          NODE_VERSION_SOURCE: ${{ needs.build.outputs.node_version_source }}
          NODE_PIN: ${{ needs.build.outputs.node_pin }}
          BUILD_OBSERVATION: ${{ needs.build.outputs.build_observation }}
          PACKAGE_MANAGER_VERSION: ${{ needs.build.outputs.package_manager_version }}
          WORKFLOW_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile, mkdir, rm, lstat, open } from 'node:fs/promises';
          import { constants } from 'node:fs';
          import { createHash } from 'node:crypto';
          const env = process.env;
          if (!/^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(env.NODE_VERSION ?? '') || !['.node-version', '.nvmrc', 'package.json:engines.node', 'package.json:volta.node', 'scripts/agent-bootstrap.sh:NODE_VERSION', 'default'].includes(env.NODE_VERSION_SOURCE)) throw new Error('Invalid build Node runtime');
          const MAX_ARTIFACT_MANIFEST_BYTES = 4 * 1024 * 1024;
          const MAX_ARTIFACT_ENTRY_BYTES = 24 * 1024 * 1024;
          const MAX_ARTIFACT_PAYLOAD_BYTES = 96 * 1024 * 1024;
          const MAX_ARTIFACT_ENTRIES = 2048;
          const broker = new URL(env.BROKER_URL);
          if (broker.protocol !== 'https:' || broker.username || broker.password || broker.pathname !== '/' || broker.search || broker.hash) throw new Error('Broker must be an HTTPS origin');
          const api = async path => {
            const response = await fetch(`https://api.github.com${path}`, { headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' } });
            if (!response.ok) throw new Error(`GitHub API ${response.status}`);
            return response.json();
          };
          const oidcResponse = await fetch(`${env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(broker.origin)}`, { headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!oidcResponse.ok) throw new Error('OIDC request failed');
          const { value: token } = await oidcResponse.json();
          // Broker verifies signature; here the runner-provided token supplies reusable workflow identity.
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'));
          if (!/@[a-f0-9]{40}$/.test(claims.job_workflow_ref)) throw new Error('Caller must pin trusted workflow to full commit SHA');
          const commit = await api(`/repos/${env.GITHUB_REPOSITORY}/git/commits/${env.GITHUB_SHA}`);
          if (!['edition', 'project'].includes(env.BUILD_PROFILE)) throw new Error('Unsupported build profile');
          const lock = env.BUILD_PROFILE === 'edition' ? await api(`/repos/${env.GITHUB_REPOSITORY}/contents/sources.lock.json?ref=${env.GITHUB_SHA}`) : null;
          if (commit.sha !== env.GITHUB_SHA || !/^[a-f0-9]{40}$/.test(commit.tree?.sha) || (lock !== null && (lock.encoding !== 'base64' || typeof lock.content !== 'string'))) throw new Error('Invalid immutable source response');
          if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*\.json$/.test(env.ARTIFACT_FILE) || env.ARTIFACT_FILE === 'release-provenance.json') throw new Error('Invalid artifact filename');
          let project, sourceProvenance = 'source-lock', sourceIdentityBytes = lock === null ? null : Buffer.from(lock.content, 'base64');
          if (env.BUILD_PROFILE === 'project') {
            const descriptor = await api(`/repos/${env.GITHUB_REPOSITORY}/contents/rer-project.json?ref=${env.GITHUB_SHA}`);
            if (descriptor.encoding !== 'base64' || typeof descriptor.content !== 'string') throw new Error('Invalid immutable project descriptor');
            sourceProvenance = 'project-descriptor';
            sourceIdentityBytes = Buffer.from(descriptor.content, 'base64');
            project = JSON.parse(sourceIdentityBytes);
            if (project.schema !== 1 || project.deployment?.target !== 'cloudflare-workers' || (project.deployment.artifactFile ?? 'rer-worker-artifact.json') !== env.ARTIFACT_FILE || env.VERIFICATION_PROFILE !== 'full') throw new Error('Immutable project deployment descriptor mismatch');
          } else if (!['lamp-worker-artifact.json','happytohelp-worker-artifact.json'].includes(env.ARTIFACT_FILE)) throw new Error('Unsupported edition artifact');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          if (!['full','visual'].includes(env.VERIFICATION_PROFILE)) throw new Error('Unsupported verification profile');
          const safeRelativePath = value => Boolean(value) && !value.startsWith('/') && !value.includes('\\') && !value.split('/').some(part => !part || part === '.' || part === '..');
          const safeModuleName = value => safeRelativePath(value) && !value.startsWith('payload/') && !/[\x00-\x1f\x7f"\\]/.test(value);
          const safeAssetPath = value => value.startsWith('/') && !value.includes('\\') && !value.slice(1).split('/').some(part => !part || part === '.' || part === '..');
          const privateArtifactEntry = value => /^(?:\.env(?:\..*)?|\.dev\.vars(?:\..*)?|\.npmrc|\.yarnrc(?:\.yml)?|\.netrc|\.pypirc)$/i.test(value.split('/').at(-1));
          const moduleTypes = new Set(['esm', 'commonjs', 'text', 'buffer', 'compiled-wasm']);
          const rejectUnknown = (value, fields, label) => { for (const key of Object.keys(value)) if (!fields.includes(key)) throw new Error(`Unexpected ${label} field`); };
          const decode = value => {
            if (typeof value !== 'string' || value.length % 4 === 1) throw new Error('Invalid legacy artifact payload encoding');
            const padding = value.endsWith('==') ? 2 : value.endsWith('=') ? 1 : 0;
            const contentLength = value.length - padding;
            for (let index = 0; index < contentLength; index += 1) {
              const code = value.charCodeAt(index);
              if (!((code >= 0x41 && code <= 0x5a) || (code >= 0x61 && code <= 0x7a) || (code >= 0x30 && code <= 0x39) || code === 0x2b || code === 0x2f)) throw new Error('Invalid legacy artifact payload encoding');
            }
            if (padding && value.slice(contentLength) !== '='.repeat(padding)) throw new Error('Invalid legacy artifact payload encoding');
            const bytes = Buffer.from(value, 'base64');
            if (bytes.toString('base64') !== value) throw new Error('Non-canonical legacy artifact payload encoding');
            return bytes;
          };
          const candidatePath = `candidate/${env.ARTIFACT_FILE}`;
          const candidateStat = await lstat(candidatePath);
          if (!candidateStat.isFile() || candidateStat.isSymbolicLink()) throw new Error('Candidate manifest must be a regular file');
          if (candidateStat.size > MAX_ARTIFACT_PAYLOAD_BYTES * 2) throw new Error('Candidate manifest exceeds size limit');
          const sourceArtifact = JSON.parse((await readFile(candidatePath)).toString('utf8'));
          if (sourceArtifact?.schema === 2 && candidateStat.size > MAX_ARTIFACT_MANIFEST_BYTES) throw new Error('Artifact manifest exceeds size limit');
          if (!sourceArtifact || typeof sourceArtifact !== 'object' || Array.isArray(sourceArtifact)) throw new Error('Invalid legacy artifact');
          rejectUnknown(sourceArtifact, ['schema', 'deploymentSpec', 'mainModule', 'modules', 'assets'], 'legacy artifact');
          if (![1,2].includes(sourceArtifact.schema) || typeof sourceArtifact.mainModule !== 'string' || !safeModuleName(sourceArtifact.mainModule) || !Array.isArray(sourceArtifact.modules) || !sourceArtifact.modules.length || !Array.isArray(sourceArtifact.assets)) throw new Error('Invalid legacy artifact structure');
          if (env.BUILD_PROFILE === 'project' && sourceArtifact.deploymentSpec === undefined) throw new Error('Project artifact requires explicit deployment specification');
          if (sourceArtifact.deploymentSpec !== undefined && (!sourceArtifact.deploymentSpec || typeof sourceArtifact.deploymentSpec !== 'object' || Array.isArray(sourceArtifact.deploymentSpec))) throw new Error('Invalid legacy deployment specification');
